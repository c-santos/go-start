services:
  app:
    build: .
    ports:
      - '8000:8000'
    volumes: 
      - ./:/app/

  db:
    image: postgres
    ports: 
      - '5432:5432'
    expose:
      - '5432'
    volumes:
      - ./db-data:/var/lib/postgresql/data
    environment:
      POSTGRES_PASSWORD: $DB_PASS
      POSTGRES_DB: $DB_NAME

